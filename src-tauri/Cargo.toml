[package]
name = "vibe-hardware"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "vibe-hardware"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vibe_hardware_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "process", "macros", "time", "sync", "io-util", "fs", "signal"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] } # ChatEvent tool-call input is serde_json::Value (M3)
uuid = { version = "1.26.1", features = ["v4", "serde"] }
tracing = "0.1.44"
tauri-plugin-log = "2.9.2"
chrono = { version = "0.4.45", features = ["serde"] }
which = "8.0.6"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "query"] }
serialport = { version = "4", default-features = false }
git2 = "0.19"
tauri-plugin-dialog = "2.7.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_System_Console"] }

