name: Pages

# M10: a static download page listing the latest GitHub Release's per-platform installers
# (`scripts/render-download-page.mjs`). Re-runs whenever a release is published, or on
# demand. One-time manual setup this workflow can't do for you: repo Settings → Pages →
# Build and deployment → Source: "GitHub Actions".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render download page
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p public
          node scripts/render-download-page.mjs > public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
